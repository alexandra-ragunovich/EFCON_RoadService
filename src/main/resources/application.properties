spring.application.name=road_service
server.port=8085
apininjas.api.key=
grpc.server.port=-1
grpc.client.integration-client.address=static://integration-service:9090
grpc.client.integration-client.negotiation-type=plaintext
spring.datasource.url=jdbc:postgresql://postgres:5432/travel_road_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.jdbc=DEBUG
yandex.rasp.api.key=
yandex.rasp.api.url=https://api.rasp.yandex.net/v3.0/